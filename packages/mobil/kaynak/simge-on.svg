<!-- Uygulama simgesinin ön katmanı (Android adaptive icon "foreground", 108x108 dp).
     Güvenli alan ortadaki 66 dp'lik dairedir; taş bu alanın içinde kalır.
     Arka katman düz zümrüt yeşilidir (res/values/ic_launcher_background.xml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="isik" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#1c8a5f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d5a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.7" stop-color="#f6ecd6"/>
      <stop offset="1" stop-color="#e8d9b8"/>
    </linearGradient>
    <linearGradient id="altin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c48d25"/>
    </linearGradient>
  </defs>
  <circle cx="54" cy="54" r="48" fill="url(#isik)"/>
  <g transform="rotate(-6 54 56)">
    <!-- taşın kalınlığı -->
    <rect x="37" y="33" width="34" height="46" rx="6" fill="#b9a57c"/>
    <!-- taşın yüzü -->
    <rect x="37" y="30" width="34" height="46" rx="6" fill="url(#tas)" stroke="#d6c49c" stroke-width="0.8"/>
    <!-- kırmızı 1 -->
    <path d="M49.5 43 L56 38 L60.2 38 L60.2 56.5 L64.5 56.5 L64.5 61 L49.5 61 L49.5 56.5 L54.6 56.5 L54.6 45.2 L49.5 48.2 Z" fill="#d7263d"/>
    <circle cx="57" cy="68" r="2.4" fill="#d7263d"/>
    <!-- okey yıldızı -->
    <path d="M65 31.8 l1.3 3 3.2.3-2.4 2.1.7 3.1-2.8-1.6-2.8 1.6.7-3.1-2.4-2.1 3.2-.3z" fill="url(#altin)"/>
  </g>
</svg>
