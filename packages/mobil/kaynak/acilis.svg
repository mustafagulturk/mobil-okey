<!-- Açılış ekranı (splash) arka planı. Görüntü ekrana gerilerek sığdırıldığı için
     betik bunu her boyut için ayrı ayrı çizer; taş hep ortada ve oranı bozulmadan durur. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="cuha" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#137450"/>
      <stop offset="0.5" stop-color="#0d5a3d"/>
      <stop offset="1" stop-color="#063526"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#cuha)"/>
</svg>
