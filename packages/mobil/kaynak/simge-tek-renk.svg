<!-- Temalı (monochrome) simge katmanı, Android 13+. Sadece şekil (saydamlık) kullanılır;
     rengi sistem duvar kağıdına göre verir. Taş dolu, "1" ve yıldız oyuk. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <mask id="oyuk">
      <rect width="108" height="108" fill="#fff"/>
      <g transform="rotate(-6 54 56)" fill="#000">
        <path d="M49.5 43 L56 38 L60.2 38 L60.2 56.5 L64.5 56.5 L64.5 61 L49.5 61 L49.5 56.5 L54.6 56.5 L54.6 45.2 L49.5 48.2 Z"/>
        <circle cx="57" cy="68" r="2.4"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#oyuk)">
    <g transform="rotate(-6 54 56)" fill="#fff">
      <rect x="37" y="30" width="34" height="46" rx="6"/>
    </g>
  </g>
</svg>
